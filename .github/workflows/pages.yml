name: Deploy PPTKit Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:browser
      - run: pnpm --filter @pptkit/dev-app typecheck
      - run: pnpm --filter @pptkit/dev-app build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test scripts/playground-pages.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: examples/dev-app/dist/playground

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
